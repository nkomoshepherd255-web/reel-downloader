<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1877f2, #0a3d8f);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  h1 { color: #1877f2; margin-bottom: 10px; font-size: 26px; }
  p.sub { color: #666; margin-bottom: 25px; font-size: 14px; }
  input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 15px;
    outline: none;
  }
  input:focus { border-color: #1877f2; }
  button {
    width: 100%;
    padding: 14px;
    background: #1877f2;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #0a3d8f; }
  button:disabled { background: #999; cursor: not-allowed; }
  #status { margin-top: 15px; font-size: 14px; color: #666; }
  #error { color: #d32f2f; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>📥 Reel Downloader</h1>
    <p class="sub">Paste a Facebook Reel link below</p>
    <input id="url" type="text" placeholder="https://www.facebook.com/reel/..." />
    <button id="btn" onclick="download()">Download Reel</button>
    <div id="status"></div>
    <div id="error"></div>
  </div>

<script>
// ⚠️ REPLACE THIS with your Render URL in the next step
const API_URL = "https://facebook-reel-downloader-ckcv.onrender.com";

async function download() {
  const url = document.getElementById('url').value.trim();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const error = document.getElementById('error');

  error.textContent = '';
  status.textContent = '';

  if (!url) {
    error.textContent = 'Please paste a link first.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Downloading...';
  status.textContent = 'This can take 10–30 seconds. Please wait.';

  try {
    const res = await fetch(API_URL + '/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url })
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || 'Download failed.');
    }

    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'reel.mp4';
    a.click();
    URL.revokeObjectURL(a.href);

    status.textContent = '✅ Done! Check your downloads.';
  } catch (e) {
    error.textContent = '❌ ' + e.message;
    status.textContent = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Download Reel';
  }
}
</script>
</body>
</html>
